<style>

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; background: var(--papel); color: var(--tinta); font: 400 1.05rem/1.55 "DM Sans", system-ui, sans-serif; display: grid; place-items: center; padding: 2rem 1.25rem; }

  h1 em { color: var(--rojo); }
  .estado { display: inline-flex; align-items: center; gap: .6rem; margin-top: 2rem; padding: .7rem 1.1rem; border-radius: 999px; background: #fff; box-shadow: 0 6px 18px -8px rgba(18,20,23,.25); font-weight: 600; }
  .estado i { width: .7rem; height: .7rem; border-radius: 50%; background: var(--naranja); animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .estado i { animation: none; } }
  p.nota { color: var(--suave); margin-top: 1.5rem; max-width: 34rem; }
  svg { position: fixed; pointer-events: none; }
